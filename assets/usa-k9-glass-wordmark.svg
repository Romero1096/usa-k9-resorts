<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">USA K9 Resorts</title>
  <desc id="desc">Translucent white and warm-gold USA K9 Resorts wordmark</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;display=swap');
    .top { font-family: 'Tenor Sans', Arial, sans-serif; font-size: 106px; letter-spacing: 6px; text-anchor: middle; }
    .resorts { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 14px; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="white-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f2ea" stop-opacity=".56"/>
      <stop offset=".32" stop-color="#f5f2ea" stop-opacity=".13"/>
      <stop offset=".72" stop-color="#d7e4ea" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f5f2ea" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="gold-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1ae" stop-opacity=".76"/>
      <stop offset=".4" stop-color="#d8aa6d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d8aa6d" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="line-glass" x1="0" x2="1">
      <stop offset="0" stop-color="#d8aa6d" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#ffe1ae" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d8aa6d" stop-opacity=".24"/>
    </linearGradient>
  </defs>
  <text class="top" x="450" y="126" fill="rgba(7,10,13,.32)" transform="translate(4 7)">USA <tspan>K9</tspan></text>
  <text class="top" x="450" y="126" fill="url(#white-glass)" stroke="rgba(245,242,234,.82)" stroke-width="1.15" paint-order="stroke">USA <tspan fill="url(#gold-glass)" stroke="rgba(255,230,190,.84)">K9</tspan></text>
  <text class="top" x="450" y="126" fill="none" stroke="rgba(255,255,255,.7)" stroke-width=".65" opacity=".74" transform="translate(-1 -1)">USA <tspan>K9</tspan></text>
  <line x1="176" y1="189" x2="263" y2="189" stroke="url(#line-glass)" stroke-width="3" stroke-linecap="round"/>
  <text class="resorts" x="465" y="200" fill="rgba(216,170,109,.42)" stroke="rgba(255,229,188,.8)" stroke-width=".65" paint-order="stroke">RESORTS</text>
  <line x1="637" y1="189" x2="724" y2="189" stroke="url(#line-glass)" stroke-width="3" stroke-linecap="round"/>
</svg>
